name: Supabase keep-alive

on:
  schedule:
    # Daily at 06:17 UTC. Supabase pauses free-tier projects after ~1 week of
    # inactivity, so a single weekly ping is risky — daily gives margin.
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Query americanas table
        env:
          # Map the GitHub secrets to the exact VITE_ names your local env uses
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          
          # Your original script will now work perfectly because these variables exist!
          if [ -z "${VITE_SUPABASE_URL:-}" ] || [ -z "${VITE_SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY env vars"
            exit 1
          fi
          
          status=$(curl -sS -o /tmp/body -w "%{http_code}" \
            -H "apikey: ${VITE_SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${VITE_SUPABASE_ANON_KEY}" \
            "${VITE_SUPABASE_URL}/rest/v1/americanas?select=id&limit=1")
          
          echo "HTTP ${status}"
          cat /tmp/body
          echo
          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            exit 1
          fi
